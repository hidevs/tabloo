name: publish

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - run: npx playwright install --with-deps chromium
        working-directory: scripts
      - run: npm test
        working-directory: scripts
      - run: node publish.mjs
        working-directory: scripts
      - name: Commit and push if data changed
        run: |
          git diff --quiet data && exit 0
          git config user.name "Tabloo Publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add data
          git commit -m "data: refresh market snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
